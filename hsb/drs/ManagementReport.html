                    </div>
                    <div class="card-body">
                        <div class="row g-3 align-items-end justify-content-center mb-3">
                            <div class="col-auto">
                                <label class="form-label mb-1">Whitelabel</label>
                                <select id="whitelabel" class="form-select form-select-lg">
                                    <option value="HSB">HSB (Direct/IB)</option>
                                    <option value="GLR">GLR (Glory)</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label mb-1">Date</label>
                                <input type="text" id="date-input" class="form-control form-control-lg" placeholder="Select date" readonly>
                            </div>
                            
                            <div class="col-auto">
                                <button class="btn btn-primary btn-lg px-4" onclick="runReport()">Start</button>
                                <button class="btn btn-outline-secondary btn-lg px-4" onclick="clearAll()">CLEAR</button>
                            </div>
                        </div>
                        <p class="info-yellow small text-center mb-0">AdditionalInfo: <code>Whitelabel_DD-MM-YYYY</code></p>
                        <div id="loading" class="text-center py-5 d-none"><div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem"></div><p>Running Management Report...</p></div>
                        <div id="error-box" class="alert alert-danger d-none mt-3" style="white-space:pre-wrap"></div>
                        <div id="result-container" class="d-none mt-4"><div id="reports-content"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
    <script>

    const socket = io();
    const REPORT_TYPE = 'ManagementReport';
    let fp = null;
    let lastReportData = null;
    let hsbView = 'IB'; // HSB only: 'IB' | 'Direct'

    function fmt(n) {
        if (n == null || n === '') return '-';
        const v = Number(n);
        return isNaN(v) ? String(n) : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function numClass(n) {
        const v = Number(n);
        if (n == null || n === '' || isNaN(v)) return '';
        return v > 0 ? 'positive' : (v < 0 ? 'negative' : '');
    }
    function cell(v) {
        return `<td class="text-end ${numClass(v)}">${fmt(v)}</td>`;
    }
    // Merged row: same value spans Daily+Monthly+Yearly (3 cols)
    function cellMerged3(v) {
        return `<td class="text-end ${numClass(v)}" colspan="3">${fmt(v)}</td>`;
    }
    // Merged row: same value spans Daily+Monthly (2 cols)
    function cellMerged2(v) {
        return `<td class="text-end ${numClass(v)}" colspan="2">${fmt(v)}</td>`;
    }

    function runReport() {
        const wl = document.getElementById('whitelabel').value;
        let dateVal = (document.getElementById('date-input') && document.getElementById('date-input').value.trim()) || '15-09-2025';
        let parts = dateVal.split('-');
        if (parts.length !== 3) { dateVal = '15-09-2025'; parts = dateVal.split('-'); }
        const d = +parts[0], mo = +parts[1], y = +parts[2];
        const dt = new Date(y, mo - 1, d);
        if (dt.getDay() === 0 || dt.getDay() === 6) return alert('Weekends (Sat/Sun) are not allowed');
        const additionalInfo = `${wl}_${dateVal}`;

        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        lastReportData = null;
        hsbView = 'IB';
        socket.emit('run-report', { reportType: REPORT_TYPE, additionalInfo });
    }

    function clearAll() {
        if (fp) fp.clear();
        document.getElementById('whitelabel').value = 'HSB';
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        document.getElementById('reports-content').innerHTML = '';
        lastReportData = null;
        hsbView = 'IB';
    }

    function setHsbView(view) {
        if (view !== 'IB' && view !== 'Direct') return;
        hsbView = view;
        if (lastReportData) render(lastReportData);
    }

    function render(data) {
        lastReportData = data;
        const isGlr = !!(data.IsGLR === true || data.IsGLR === 'true' || data.IsGLR === 1);
        const metrics = data.Metrics || {};

        // Resolve Daily / Monthly / Yearly metric sources for current view
        let dailyKey, monthlyKey, yearlyKey, viewLabel;
        if (isGlr) {
            dailyKey = 'DailyGLR';
            monthlyKey = 'MonthlyGLR';
            yearlyKey = 'YearlyGLR';
            viewLabel = 'GLR';
        } else {
            dailyKey = hsbView === 'Direct' ? 'DailyDirect' : 'DailyIB';
            monthlyKey = hsbView === 'Direct' ? 'MonthlyDirect' : 'MonthlyIB';
            yearlyKey = hsbView === 'Direct' ? 'YearlyDirect' : 'YearlyIB';
            viewLabel = hsbView;
        }
        const D = metrics[dailyKey] || {};
        const M = metrics[monthlyKey] || {};
        const Y = metrics[yearlyKey] || {};

        // ---- Account Tracer (top) ----
        const tracer = data.AccountTracer || [];
        const tracerHtml = tracer.map((t, i) =>
            `<tr>
                <td>${i + 1}</td>
                <td>${t.Date || '-'}</td>
                <td>${t.Login || '-'}</td>
                <td>${t.PrevTempRate || '-'} → ${t.NewTempRate || '-'}</td>
                <td>${t.PrevTempBusinessType || '-'} → ${t.NewTempBusinessType || '-'}</td>
            </tr>`
        ).join('');

        let html = '';

        // HSB IB / Direct toggle (only when results shown and not GLR)
        if (!isGlr) {
            html += `
            <div class="d-flex justify-content-center gap-2 mb-3">
                <button type="button" class="btn filter-btn ${hsbView === 'IB' ? 'active' : ''}" onclick="setHsbView('IB')">IB</button>
                <button type="button" class="btn filter-btn ${hsbView === 'Direct' ? 'active' : ''}" onclick="setHsbView('Direct')">Direct</button>
            </div>
            <p class="text-center text-muted small mb-3">Viewing: <strong>${viewLabel}</strong></p>`;
        }

        html += `
        <div class="card mb-4">
            <div class="card-header bg-dark text-white section-header">Account Tracer (Total changes: ${tracer.length})</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm mb-0">
                    <thead><tr><th>#</th><th>Date</th><th>Login</th><th>Rate</th><th>Business Type</th></tr></thead>
                    <tbody>${tracerHtml || '<tr><td colspan="5" class="text-center text-muted">No changes</td></tr>'}</tbody>
                </table>
            </div>
        </div>`;

        // ---- ClientTrade ----
        // FloatingPL: merge Daily/Monthly/Yearly into one value (use Daily)
        const clientTradeRows = [
            ['NetProfit', false],
            ['RealizedPL', false],
            ['BalanceAdjustment', false],
            ['AdjustTransferPos', false, 'AdjustTransferPosition'],
            ['Commission', false],
            ['Lot', false],
            ['FloatingPL', true]
        ].map(([key, merged, label]) => {
            const name = label || key;
            if (merged) {
                return `<tr><td><strong>${name}</strong></td>${cellMerged3(D[key])}</tr>`;
            }
            return `<tr><td><strong>${name}</strong></td>${cell(D[key])}${cell(M[key])}${cell(Y[key])}</tr>`;
        }).join('');

        html += `
        <div class="card mb-4">
            <div class="card-header bg-info text-white section-header">ClientTrade (${viewLabel})</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm mb-0">
                    <thead><tr>
                        <th>Metric</th>
                        <th class="text-end">Daily</th>
                        <th class="text-end">Monthly</th>
                        <th class="text-end">Yearly</th>
                    </tr></thead>
                    <tbody>${clientTradeRows}</tbody>
                </table>
            </div>
        </div>`;

        // ---- BalanceReport ----
        // ClientAccountBalance: merge into one row
        const balanceRows = [
            ['ClientAccountBalance', true],
            ['NetDeposit', false],
            ['Deposit', false],
            ['Withdrawal', false],
            ['NewDepositAmount', false],
            ['NewFundedAccount', false],
            ['AccountTraded', false]
        ].map(([key, merged]) => {
            if (merged) {
                return `<tr><td><strong>${key}</strong></td>${cellMerged3(D[key])}</tr>`;
            }
            return `<tr><td><strong>${key}</strong></td>${cell(D[key])}${cell(M[key])}${cell(Y[key])}</tr>`;
        }).join('');

        html += `
        <div class="card mb-4">
            <div class="card-header bg-primary text-white section-header">BalanceReport (${viewLabel})</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm mb-0">
                    <thead><tr>
                        <th>Metric</th>
                        <th class="text-end">Daily</th>
                        <th class="text-end">Monthly</th>
                        <th class="text-end">Yearly</th>
                    </tr></thead>
                    <tbody>${balanceRows}</tbody>
                </table>
            </div>
        </div>`;

        // ---- Top 10 (Login / Volume / Amount only) ----
        function top10List(section) {
            if (!section) return [];
            if (isGlr) return Array.isArray(section) ? section : [];
            // HSB: section is { IB: [], Direct: [] }
            if (hsbView === 'Direct') return section.Direct || [];
            return section.IB || [];
        }

        function renderTop10(title, section) {
            const list = top10List(section);
            const body = list.map(r =>
                `<tr>
                    <td>${r.Login || '-'}</td>
                    <td class="text-end">${fmt(r.Volume)}</td>
                    <td class="text-end ${numClass(r.Amount)}">${fmt(r.Amount)}</td>
                </tr>`
            ).join('');
            return `
            <div class="card mb-4">
                <div class="card-header bg-secondary text-white section-header">${title} (${viewLabel})</div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-bordered table-sm mb-0">
                        <thead><tr>
                            <th>Login</th>
                            <th class="text-end">Volume</th>
                            <th class="text-end">Amount</th>
                        </tr></thead>
                        <tbody>${body || '<tr><td colspan="3" class="text-center text-muted">No data</td></tr>'}</tbody>
                    </table>
                </div>
            </div>`;
        }

        html += renderTop10('Top 10 Winner (Daily)', data.Top10Winner);
        html += renderTop10('Top 10 Loser (Daily)', data.Top10Loser);
        html += renderTop10('Top 10 Volume (Daily)', data.Top10Volume);
        html += renderTop10('Top 10 Deposit (Daily)', data.Top10Deposit);
        html += renderTop10('Top 10 Withdrawal (Daily)', data.Top10Withdrawal);

        // ---- Detailed Each Symbol ----
        // Daily/Monthly from selected BT; FloatingPL & FloatingInterest merged (Daily value)
        const detailList = Array.isArray(data.DetailedEachSymbol) ? data.DetailedEachSymbol : [];
        const detailMetrics = [
            'NetProfit', 'RealizedPL', 'RealizedInterest', 'Commission', 'Lot',
            'Lot[XAUUSD]', 'Lot[XAGUSD]', 'FloatingPL', 'FloatingInterest'
        ];
        const mergedDetail = { FloatingPL: true, FloatingInterest: true };

        function detailVal(row, which) {
            if (isGlr) {
                return which === 'daily' ? row.DailyGlory : row.MonthlyGlory;
            }
            if (hsbView === 'Direct') {
                return which === 'daily' ? row.DailyDirect : row.MonthlyDirect;
            }
            return which === 'daily' ? row.DailyIB : row.MonthlyIB;
        }

        let detailBody = '';
        if (!detailList.length) {
            detailBody = '<tr><td colspan="4" class="text-center text-muted">No data</td></tr>';
        } else {
            // Group by category preserving order
            const cats = [];
            const byCat = {};
            detailList.forEach(r => {
                const c = r.Category || '';
                if (!byCat[c]) { byCat[c] = {}; cats.push(c); }
                byCat[c][r.Metric] = r;
            });
            cats.forEach(cat => {
                detailMetrics.forEach(metric => {
                    const r = byCat[cat][metric];
                    if (!r) return;
                    if (mergedDetail[metric]) {
                        const v = detailVal(r, 'daily');
                        detailBody += `<tr>
                            <td>${cat}</td>
                            <td><strong>${metric}</strong></td>
                            ${cellMerged2(v)}
                        </tr>`;
                    } else {
                        detailBody += `<tr>
                            <td>${cat}</td>
                            <td><strong>${metric}</strong></td>
                            ${cell(detailVal(r, 'daily'))}
                            ${cell(detailVal(r, 'monthly'))}
                        </tr>`;
                    }
                });
            });
            if (!detailBody) {
                detailBody = '<tr><td colspan="4" class="text-center text-muted">No data</td></tr>';
            }
        }

        html += `
        <div class="card mb-4">
            <div class="card-header bg-warning text-dark section-header">Detailed Each Symbol (${viewLabel})</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm mb-0">
                    <thead><tr>
                        <th>Category</th>
                        <th>Metric</th>
                        <th class="text-end">Daily</th>
                        <th class="text-end">Monthly</th>
                    </tr></thead>
                    <tbody>${detailBody}</tbody>
                </table>
            </div>
        </div>`;

        document.getElementById('reports-content').innerHTML = html;
        document.getElementById('result-container').classList.remove('d-none');
    }

    // Thin border style for Excel cells (requires xlsx-js-style)
    const XL_BORDER = {
        top: { style: 'thin', color: { rgb: '000000' } },
        bottom: { style: 'thin', color: { rgb: '000000' } },
        left: { style: 'thin', color: { rgb: '000000' } },
        right: { style: 'thin', color: { rgb: '000000' } }
    };
    const XL_HEADER_STYLE = {
        font: { bold: true },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_TITLE_STYLE = {
        font: { bold: true, sz: 12 },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_CELL_STYLE = {
        border: XL_BORDER,
        alignment: { vertical: 'center' }
    };
    const XL_NUM_POS = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '#,##0.00'
    };
    const XL_NUM_NEG = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '#,##0.00;(#,##0.00)',
        font: { color: { rgb: 'FF0000' } }
    };
    const XL_LOGIN = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '0'
    };
    const XL_YELLOW = {
        font: { bold: true },
        fill: { fgColor: { rgb: 'FFFF00' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_ORANGE = {
        font: { bold: true },
        fill: { fgColor: { rgb: 'F4B183' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_BLUE = {
        font: { bold: true },
        fill: { fgColor: { rgb: '5B9BD5' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center', color: { rgb: 'FFFFFF' } }
    };
    const XL_LIGHT_BLUE = {
        font: { bold: true },
        fill: { fgColor: { rgb: 'BDD7EE' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_CAT_YELLOW = {
        font: { bold: true },
        fill: { fgColor: { rgb: 'FFE699' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };

    // Apply borders to cells with values + all cells inside merge ranges; negatives in red
    function applySheetBorders(ws) {
        if (!ws) return;

        // Ensure every cell in a merge range exists and has a border (fixes missing right border)
        if (ws['!merges'] && ws['!merges'].length) {
            ws['!merges'].forEach(m => {
                for (let R = m.s.r; R <= m.e.r; R++) {
                    for (let C = m.s.c; C <= m.e.c; C++) {
                        const addr = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws[addr]) ws[addr] = { t: 's', v: '' };
                        const cell = ws[addr];
                        if (!cell.s) cell.s = { border: XL_BORDER };
                        else cell.s = Object.assign({}, cell.s, { border: XL_BORDER });
                    }
                }
            });
        }

        Object.keys(ws).forEach(addr => {
            if (addr[0] === '!') return;
            const cell = ws[addr];
            if (!cell) return;
            const v = cell.v;
            if (v === null || v === undefined || v === '') {
                // keep border if already set (merge fillers)
                if (cell.s && cell.s.border) return;
                return;
            }

            // Preserve pre-assigned colored styles (title fills etc.) but ensure border + num formats
            if (cell.s && cell.s.fill) {
                cell.s = Object.assign({}, cell.s, { border: XL_BORDER });
                return;
            }

            if (typeof v === 'number') {
                if (cell.s && cell.s.numFmt === '0') {
                    cell.s = Object.assign({}, XL_LOGIN);
                } else {
                    cell.s = (v < 0) ? XL_NUM_NEG : XL_NUM_POS;
                }
            } else {
                cell.s = cell.s ? Object.assign({}, cell.s, { border: XL_BORDER }) : XL_CELL_STYLE;
            }
        });
    }

    function styleRange(ws, r, c1, c2, style) {
        for (let C = c1; C <= c2; C++) {
            const addr = XLSX.utils.encode_cell({ r: r, c: C });
            if (!ws[addr]) ws[addr] = { t: 's', v: '' };
            ws[addr].s = Object.assign({}, style, { border: XL_BORDER });
        }
    }

    function fmtDateBanner(dateVal, bt) {
        // dateVal expected d-m-Y
        const parts = String(dateVal || '').trim().split('-');
        let label = dateVal || '';
        if (parts.length === 3) {
            const d = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const y = parts[2];
            const months = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            if (m >= 1 && m <= 12) {
                label = String(d).padStart(2, '0') + ' ' + months[m] + ' ' + y;
            }
        }
        const btLabel = (bt === 'Glory') ? 'Glory' : bt;
        return label + ' (' + btLabel + ')';
    }

    // Build one worksheet: returns { aoa, merges, styleHints }
    // styleHints: array of { r, c1, c2, styleKey }
    function buildSheetAoa(data, bt) {
        const isGlr = !!(data.IsGLR === true || data.IsGLR === 'true' || data.IsGLR === 1);
        const metrics = data.Metrics || {};
        const period = ((document.getElementById('date-input') || {}).value || '').trim();
        const btPrefix = (bt === 'Glory') ? 'Glory' : bt;

        let dailyKey, monthlyKey, yearlyKey;
        if (isGlr || bt === 'Glory') {
            dailyKey = 'DailyGLR'; monthlyKey = 'MonthlyGLR'; yearlyKey = 'YearlyGLR';
        } else if (bt === 'Direct') {
            dailyKey = 'DailyDirect'; monthlyKey = 'MonthlyDirect'; yearlyKey = 'YearlyDirect';
        } else {
            dailyKey = 'DailyIB'; monthlyKey = 'MonthlyIB'; yearlyKey = 'YearlyIB';
        }
        const D = metrics[dailyKey] || {};
        const M = metrics[monthlyKey] || {};
        const Y = metrics[yearlyKey] || {};

        const n = (v) => (v == null || v === '' || isNaN(Number(v)) ? null : Number(v));
        const aoa = [];
        const merges = [];
        const styleHints = []; // { r, c1, c2, key }

        function mergeCols(r, c1, c2) {
            if (c2 > c1) merges.push({ s: { r: r, c: c1 }, e: { r: r, c: c2 } });
        }
        function hint(r, c1, c2, key) {
            styleHints.push({ r: r, c1: c1, c2: c2, key: key });
        }

        // ---- Account Tracer ----
        aoa.push(['Account Tracer']);
        aoa.push(['No', 'Date', 'Login', 'Rate', 'Business Type']);
        const tracer = data.AccountTracer || [];
        tracer.forEach((t, i) => {
            const loginNum = t.Login != null ? Number(t.Login) : null;
            aoa.push([
                i + 1,
                t.Date || '',
                (loginNum != null && !isNaN(loginNum)) ? loginNum : (t.Login || ''),
                (t.PrevTempRate || '-') + ' → ' + (t.NewTempRate || '-'),
                (t.PrevTempBusinessType || '-') + ' → ' + (t.NewTempBusinessType || '-')
            ]);
        });
        aoa.push([]);

        // Date banner A..L yellow
        {
            const r = aoa.length;
            const banner = fmtDateBanner(period, btPrefix);
            const row = [banner];
            for (let i = 1; i < 12; i++) row.push(null);
            aoa.push(row);
            mergeCols(r, 0, 11);
            hint(r, 0, 11, 'yellow');
        }

        // ClientTrade (A-D orange) | BalanceReport (E-H blue)
        {
            const r = aoa.length;
            const row = [btPrefix + ' ClientTrade', null, null, null, btPrefix + ' BalanceReport', null, null, null];
            aoa.push(row);
            mergeCols(r, 0, 3);
            mergeCols(r, 4, 7);
            hint(r, 0, 3, 'orange');
            hint(r, 4, 7, 'blue');
        }

        // Flattened daily/monthly pairs; BalanceReport ends with Yearly AccountTraded
        const ctPairs = [
            ['Daily NetProfit', n(D.NetProfit), 'Monthly NetProfit', n(M.NetProfit)],
            ['Daily RealizedPL', n(D.RealizedPL), 'Monthly RealizedPL', n(M.RealizedPL)],
            ['Daily BalanceAdjustment', n(D.BalanceAdjustment), 'Monthly BalanceAdjustment', n(M.BalanceAdjustment)],
            ['Daily AdjustTransferPosition', n(D.AdjustTransferPos), 'Monthly AdjustTransferPosition', n(M.AdjustTransferPos)],
            ['Daily Commission', n(D.Commission), 'Monthly Commission', n(M.Commission)],
            ['Daily Lot', n(D.Lot), 'Monthly Lot', n(M.Lot)]
        ];
        const brPairs = [
            ['ClientAccountBalance', n(D.ClientAccountBalance), 'Monthly NetDeposit', n(M.NetDeposit)],
            ['Daily NetDeposit', n(D.NetDeposit), 'Monthly Deposit', n(M.Deposit)],
            ['Daily Deposit', n(D.Deposit), 'Monthly Withdrawal', n(M.Withdrawal)],
            ['Daily Withdrawal', n(D.Withdrawal), 'Monthly NewDepositAmount', n(M.NewDepositAmount)],
            ['Daily NewDepositAmount', n(D.NewDepositAmount), 'Monthly NewFundedAccount', n(M.NewFundedAccount)],
            ['Daily NewFundedAccount', n(D.NewFundedAccount), 'Monthly AccountTraded', n(M.AccountTraded)],
            ['Daily AccountTraded', n(D.AccountTraded), 'Yearly AccountTraded', n(Y.AccountTraded)]
        ];
        // FloatingPL row + AccountTraded aligned
        for (let i = 0; i < Math.max(ctPairs.length + 1, brPairs.length); i++) {
            if (i < ctPairs.length) {
                const L = ctPairs[i];
                const R = brPairs[i] || [null, null, null, null];
                aoa.push([L[0], L[1], L[2], L[3], R[0], R[1], R[2], R[3]]);
            } else if (i === ctPairs.length) {
                // FloatingPL alone on left
                const R = brPairs[i] || [null, null, null, null];
                aoa.push(['FloatingPL', n(D.FloatingPL), null, null, R[0], R[1], R[2], R[3]]);
            } else {
                const R = brPairs[i] || [null, null, null, null];
                aoa.push([null, null, null, null, R[0], R[1], R[2], R[3]]);
            }
        }
        aoa.push([]);

        // ---- Categories ----
        function detailVal(row, which) {
            if (!row) return null;
            if (isGlr || bt === 'Glory') {
                return which === 'daily' ? n(row.DailyGlory) : n(row.MonthlyGlory);
            }
            if (bt === 'Direct') {
                return which === 'daily' ? n(row.DailyDirect) : n(row.MonthlyDirect);
            }
            return which === 'daily' ? n(row.DailyIB) : n(row.MonthlyIB);
        }

        const detailList = Array.isArray(data.DetailedEachSymbol) ? data.DetailedEachSymbol : [];
        const byCat = {};
        detailList.forEach(r => {
            const c = r.Category || '';
            if (!byCat[c]) byCat[c] = {};
            byCat[c][r.Metric] = r;
        });

        function catBlockRows(cat) {
            const map = byCat[cat] || {};
            if (cat === 'Metal') {
                return [
                    ['Daily NetProfit', detailVal(map['NetProfit'], 'daily'), 'Monthly NetProfit', detailVal(map['NetProfit'], 'monthly')],
                    ['Daily RealizedPL', detailVal(map['RealizedPL'], 'daily'), 'Monthly RealizedPL', detailVal(map['RealizedPL'], 'monthly')],
                    ['Daily RealizedInterest', detailVal(map['RealizedInterest'], 'daily'), 'Monthly RealizedInterest', detailVal(map['RealizedInterest'], 'monthly')],
                    ['Daily Commission', detailVal(map['Commission'], 'daily'), 'Monthly Commission', detailVal(map['Commission'], 'monthly')],
                    ['Daily Lot[XAUUSD]', detailVal(map['Lot[XAUUSD]'], 'daily'), 'Monthly Lot[XAUUSD]', detailVal(map['Lot[XAUUSD]'], 'monthly')],
                    ['Daily Lot[XAGUSD]', detailVal(map['Lot[XAGUSD]'], 'daily'), 'Monthly Lot[XAGUSD]', detailVal(map['Lot[XAGUSD]'], 'monthly')],
                    ['FloatingPL', detailVal(map['FloatingPL'], 'daily'), 'FloatingInterest', detailVal(map['FloatingInterest'], 'daily')]
                ];
            }
            return [
                ['Daily NetProfit', detailVal(map['NetProfit'], 'daily'), 'Monthly NetProfit', detailVal(map['NetProfit'], 'monthly')],
                ['Daily RealizedPL', detailVal(map['RealizedPL'], 'daily'), 'Monthly RealizedPL', detailVal(map['RealizedPL'], 'monthly')],
                ['Daily RealizedInterest', detailVal(map['RealizedInterest'], 'daily'), 'Monthly RealizedInterest', detailVal(map['RealizedInterest'], 'monthly')],
                ['Daily Commission', detailVal(map['Commission'], 'daily'), 'Monthly Commission', detailVal(map['Commission'], 'monthly')],
                ['Daily Lot', detailVal(map['Lot'], 'daily'), 'Monthly Lot', detailVal(map['Lot'], 'monthly')],
                ['FloatingPL', detailVal(map['FloatingPL'], 'daily'), 'FloatingInterest', detailVal(map['FloatingInterest'], 'daily')]
            ];
        }

        function appendCats(cats, colors) {
            // title row
            const titleR = aoa.length;
            const titleRow = [];
            cats.forEach((cat, idx) => {
                if (idx > 0) { /* gap none - packed A-D, E-H, I-L */ }
                const base = idx * 4;
                while (titleRow.length < base) titleRow.push(null);
                titleRow.push(cat, null, null, null);
                mergeCols(titleR, base, base + 3);
                hint(titleR, base, base + 3, colors[idx] || 'lightblue');
            });
            aoa.push(titleRow);

            const blocks = cats.map(c => catBlockRows(c));
            const maxR = Math.max(...blocks.map(b => b.length), 0);
            for (let i = 0; i < maxR; i++) {
                const row = [];
                blocks.forEach((b, idx) => {
                    const base = idx * 4;
                    while (row.length < base) row.push(null);
                    const cells = b[i] || [null, null, null, null];
                    row.push(cells[0], cells[1], cells[2], cells[3]);
                });
                aoa.push(row);
            }
            aoa.push([]);
        }

        appendCats(['Forex', 'Metal', 'US Stock'], ['lightblue', 'catyellow', 'lightblue']);
        appendCats(['Energy', 'Index'], ['catyellow', 'lightblue']);

        // ---- Top 10 Client Rank banner ----
        {
            const r = aoa.length;
            const row = ['Top 10 Client Rank'];
            for (let i = 1; i < 12; i++) row.push(null);
            aoa.push(row);
            mergeCols(r, 0, 11);
            hint(r, 0, 11, 'blue');
        }

        function topList(section) {
            if (!section) return [];
            if (isGlr || bt === 'Glory') return Array.isArray(section) ? section : [];
            if (bt === 'Direct') return section.Direct || [];
            return section.IB || [];
        }

        // Winner / Loser / Volume — cols A-C, E-G, I-K
        {
            const titles = ['Top 10 Winner (Daily)', 'Top 10 Loser (Daily)', 'Top 10 Volume (Daily)'];
            const lists = [topList(data.Top10Winner), topList(data.Top10Loser), topList(data.Top10Volume)];
            const titleR = aoa.length;
            const titleRow = [];
            titles.forEach((t, idx) => {
                const base = idx * 4;
                while (titleRow.length < base) titleRow.push(null);
                titleRow.push(t, null, null);
                mergeCols(titleR, base, base + 2);
                hint(titleR, base, base + 2, 'orange');
            });
            aoa.push(titleRow);

            const hdrR = aoa.length;
            const hdr = [];
            titles.forEach((_, idx) => {
                const base = idx * 4;
                while (hdr.length < base) hdr.push(null);
                hdr.push('Account Number', 'Volume', 'Amount');
            });
            aoa.push(hdr);
            hint(hdrR, 0, 2, 'orange');
            hint(hdrR, 4, 6, 'orange');
            hint(hdrR, 8, 10, 'orange');

            const maxT = Math.max(...lists.map(l => l.length), 0);
            for (let i = 0; i < maxT; i++) {
                const row = [];
                lists.forEach((l, idx) => {
                    const base = idx * 4;
                    while (row.length < base) row.push(null);
                    const r = l[i] || {};
                    const loginNum = r.Login != null ? Number(r.Login) : null;
                    row.push(
                        (loginNum != null && !isNaN(loginNum)) ? loginNum : (r.Login || null),
                        n(r.Volume),
                        n(r.Amount)
                    );
                });
                aoa.push(row);
            }
            aoa.push([]);
        }

        // Deposit / Withdrawal — A-B, E-F (no Volume)
        {
            const titles = ['Top 10 Deposit (Daily)', 'Top 10 Withdrawal (Daily)'];
            const lists = [topList(data.Top10Deposit), topList(data.Top10Withdrawal)];
            const titleR = aoa.length;
            const titleRow = [];
            titles.forEach((t, idx) => {
                const base = idx * 4;
                while (titleRow.length < base) titleRow.push(null);
                titleRow.push(t, null);
                mergeCols(titleR, base, base + 1);
                hint(titleR, base, base + 1, 'orange');
            });
            aoa.push(titleRow);

            const hdrR = aoa.length;
            const hdr = [];
            titles.forEach((_, idx) => {
                const base = idx * 4;
                while (hdr.length < base) hdr.push(null);
                hdr.push('Account Number', 'Amount');
            });
            aoa.push(hdr);
            hint(hdrR, 0, 1, 'orange');
            hint(hdrR, 4, 5, 'orange');

            const maxT = Math.max(...lists.map(l => l.length), 0);
            for (let i = 0; i < maxT; i++) {
                const row = [];
                lists.forEach((l, idx) => {
                    const base = idx * 4;
                    while (row.length < base) row.push(null);
                    const r = l[i] || {};
                    const loginNum = r.Login != null ? Number(r.Login) : null;
                    row.push(
                        (loginNum != null && !isNaN(loginNum)) ? loginNum : (r.Login || null),
                        n(r.Amount)
                    );
                });
                aoa.push(row);
            }
        }

        return { aoa: aoa, merges: merges, styleHints: styleHints };
    }

    function exportExcel() {
        if (!lastReportData) return alert('No results to export. Run the report first.');

        const data = lastReportData;
        const isGlr = !!(data.IsGLR === true || data.IsGLR === 'true' || data.IsGLR === 1);
        const wl = (document.getElementById('whitelabel') || {}).value || (isGlr ? 'GLR' : 'HSB');
        const period = ((document.getElementById('date-input') || {}).value || '').trim() || 'nodate';
        const fileName = REPORT_TYPE + '_' + wl + '-' + period + '.xlsx';

        const wb = XLSX.utils.book_new();
        const sheets = isGlr ? ['Glory'] : ['IB', 'Direct'];

        const styleMap = {
            yellow: XL_YELLOW,
            orange: XL_ORANGE,
            blue: XL_BLUE,
            lightblue: XL_LIGHT_BLUE,
            catyellow: XL_CAT_YELLOW
        };

        sheets.forEach(name => {
            const built = buildSheetAoa(data, name);
            const aoa = built.aoa;
            const merges = built.merges || [];
            const hints = built.styleHints || [];
            const ws = XLSX.utils.aoa_to_sheet(aoa);

            if (merges.length) ws['!merges'] = merges;

            // Apply colored title styles first
            hints.forEach(h => {
                const st = styleMap[h.key];
                if (st) styleRange(ws, h.r, h.c1, h.c2, st);
            });

            // Mark login columns heuristically: integer-looking large numbers as Login format
            Object.keys(ws).forEach(addr => {
                if (addr[0] === '!') return;
                const cell = ws[addr];
                if (!cell || typeof cell.v !== 'number') return;
                // Account numbers typically > 100000 without decimals
                if (Number.isInteger(cell.v) && cell.v >= 100000) {
                    cell.s = Object.assign({}, XL_LOGIN);
                }
            });

            ws['!cols'] = [];
            for (let i = 0; i < 12; i++) ws['!cols'].push({ wch: i % 4 === 0 ? 28 : 14 });

            applySheetBorders(ws);
            XLSX.utils.book_append_sheet(wb, ws, name);
        });

        XLSX.writeFile(wb, fileName);
    }

    socket.on('report-result', p => { if(p.reportType!==REPORT_TYPE) return; document.getElementById('loading').classList.add('d-none'); render(p.data||{}); });
    socket.on('report-error', p => {
        if(p.reportType && p.reportType!==REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        const box=document.getElementById('error-box');
        box.textContent = p.message || 'Error';
        if(p.rawOutput) box.textContent += '\n'+p.rawOutput.substring(0,800);
        box.classList.remove('d-none');
    });


    function setTheme(t){ document.documentElement.setAttribute('data-theme',t); document.body.setAttribute('data-theme',t); localStorage.setItem('theme',t);
        document.getElementById('theme-toggle').innerHTML = t==='dark'
            ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`
            : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTheme(localStorage.getItem('theme')||'light');
        document.getElementById('theme-toggle').onclick = () => setTheme((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');
        
        const toggler = document.querySelector('.navbar-toggler');
        if (toggler) toggler.addEventListener('click', () => toggler.classList.toggle('rotated'));
// Calendar: weekends not selectable (no special gray styling)
        fp = flatpickr('#date-input', {
            dateFormat: 'd-m-Y',
            allowInput: false,
            disable: [function(date) { return (date.getDay() === 0 || date.getDay() === 6); }]
        });
    });
    </script>
