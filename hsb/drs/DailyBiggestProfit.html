                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 section-header">One Click System</h5>
                        <button id="export-excel" class="btn btn-light btn-sm" onclick="exportExcel()">Export Excel</button>
                    </div>
                    <div class="card-body">
                        <div class="row g-3 align-items-end justify-content-center mb-3">
                            <div class="col-auto">
                                <label class="form-label mb-1">Whitelabel</label>
                                <select id="whitelabel" class="form-select form-select-lg">
                                    <option value="HSB">HSB (Direct/IB)</option>
                                    <option value="GLR">GLR (Glory)</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label mb-1">Date</label>
                                <input type="text" id="date-input" class="form-control form-control-lg" placeholder="Select date" readonly>
                            </div>
                            
                            <div class="col-auto">
                                <button class="btn btn-primary btn-lg px-4" onclick="runReport()">Start</button>
                                <button class="btn btn-outline-secondary btn-lg px-4" onclick="clearAll()">CLEAR</button>
                            </div>
                        </div>
                        <p class="info-yellow small text-center mb-0">AdditionalInfo: <code>Whitelabel_DD-MM-YYYY</code></p>
                        <div id="loading" class="text-center py-5 d-none"><div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem"></div><p>Running Daily Biggest Profit...</p></div>
                        <div id="error-box" class="alert alert-danger d-none mt-3" style="white-space:pre-wrap"></div>
                        <div id="result-container" class="d-none mt-4"><div id="reports-content"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
    <script>

    const socket = io();
    const REPORT_TYPE = 'DailyBiggestProfit';
    let fp = null;
    let lastRows = [];
    function fmt(n) { if (n==null||n==='') return '-'; const v=Number(n); return isNaN(v)?String(n):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function numClass(n) { const v=Number(n); if (n==null||n===''||isNaN(v)) return ''; return v>0?'positive':(v<0?'negative':''); }
    function runReport(){

        const wl=document.getElementById('whitelabel').value;
        let dateVal = (document.getElementById('date-input') && document.getElementById('date-input').value.trim()) || '15-09-2025';
        let parts = dateVal.split('-');
        if (parts.length !== 3) { dateVal = '15-09-2025'; parts = dateVal.split('-'); }
        const d=+parts[0], mo=+parts[1], y=+parts[2];
        const dt = new Date(y, mo-1, d);
        if(dt.getDay()===0 || dt.getDay()===6) return alert('Weekends (Sat/Sun) are not allowed');
        let additionalInfo = `${wl}_${dateVal}`;

        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        socket.emit('run-report',{reportType:REPORT_TYPE,additionalInfo});
    }
    function clearAll(){
        if(fp) fp.clear();
        document.getElementById('whitelabel').value='HSB';
        lastRows = [];
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        document.getElementById('reports-content').innerHTML='';
    }

    function render(data){
        const rows = Array.isArray(data) ? data : (data.rows || data.Records || data.data || []);
        lastRows = rows;
        let body = rows.map(r => `<tr>
            <td>${r.BusinessType||r.business_type||'-'}</td>
            <td>${r.Login||r.login||'-'}</td>
            <td>${r['IDCRM/Name']||r.idcrm_name||r.Name||'-'}</td>
            <td>${r.Group||r.group||'-'}</td>
            <td class="text-end ${numClass(r.PL||r.pl)}">${fmt(r.PL||r.pl)}</td>
            <td class="text-end ${numClass(r.Lot||r.lot)}">${fmt(r.Lot||r.lot)}</td>
            <td class="text-end ${numClass(r.Floating||r.floating)}">${fmt(r.Floating||r.floating)}</td>
            <td class="text-end ${numClass(r.LifetimePLIX||r.lifetime_pl_ix)}">${fmt(r.LifetimePLIX||r.lifetime_pl_ix)}</td>
            <td class="text-end ${numClass(r.LifetimePLMT||r.lifetime_pl_mt)}">${fmt(r.LifetimePLMT||r.lifetime_pl_mt)}</td>
            <td class="text-end ${numClass(r.LifetimePL||r.lifetime_pl)}">${fmt(r.LifetimePL||r.lifetime_pl)}</td>
            <td>${r.FTD||r.ftd||'-'}</td>
            <td class="text-end ${numClass(r.Balance||r.balance)}">${fmt(r.Balance||r.balance)}</td>
        </tr>`).join('');
        document.getElementById('reports-content').innerHTML = `
        <div class="card mb-4">
            <div class="card-header bg-info text-white section-header">Daily Biggest Profit (${rows.length} rows)</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm table-hover mb-0">
                    <thead><tr>
                        <th>BusinessType</th><th>Login</th><th>IDCRM/Name</th><th>Group</th>
                        <th class="text-end">PL</th><th class="text-end">Lot</th><th class="text-end">Floating</th>
                        <th class="text-end">LifetimePLIX</th><th class="text-end">LifetimePLMT</th><th class="text-end">LifetimePL</th>
                        <th>FTD</th><th class="text-end">Balance</th>
                    </tr></thead>
                    <tbody>${body || '<tr><td colspan="12" class="text-center text-muted">No data</td></tr>'}</tbody>
                </table>
            </div>
        </div>`;
        document.getElementById('result-container').classList.remove('d-none');
    }

    // Excel export styles
    const XL_BORDER = {
        top:    { style: 'thin', color: { rgb: '000000' } },
        bottom: { style: 'thin', color: { rgb: '000000' } },
        left:   { style: 'thin', color: { rgb: '000000' } },
        right:  { style: 'thin', color: { rgb: '000000' } }
    };
    const XL_TITLE_STYLE = {
        font: { bold: true, sz: 12 },
        fill: { fgColor: { rgb: 'FFFF00' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_HEADER_STYLE = {
        font: { bold: true },
        fill: { fgColor: { rgb: 'D9D9D9' } },
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' }
    };
    const XL_CELL_STYLE = {
        border: XL_BORDER,
        alignment: { vertical: 'center' }
    };
    const XL_LOGIN_STYLE = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '0'
    };
    const XL_LOT_STYLE = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '#,##0.00'
    };
    const XL_CURR_STYLE = {
        border: XL_BORDER,
        alignment: { horizontal: 'right', vertical: 'center' },
        numFmt: '$#,##0.00;($#,##0.00)'
    };
    const XL_DATE_STYLE = {
        border: XL_BORDER,
        alignment: { horizontal: 'center', vertical: 'center' },
        numFmt: 'dd/mm/yyyy'
    };

    function toNum(v) {
        if (v == null || v === '' || v === '-') return null;
        const n = Number(String(v).replace(/,/g, ''));
        return isNaN(n) ? null : n;
    }
    function parseFtdDate(v) {
        if (v == null || v === '' || v === '-') return null;
        const s = String(v).trim();
        // expect DD/MM/YYYY or DD/MM/YYYY HH:MM:SS
        const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (!m) return null;
        const d = parseInt(m[1], 10), mo = parseInt(m[2], 10) - 1, y = parseInt(m[3], 10);
        const dt = new Date(y, mo, d);
        if (isNaN(dt.getTime())) return null;
        // Excel serial (days since 1899-12-30)
        return (Date.UTC(y, mo, d) - Date.UTC(1899, 11, 30)) / 86400000;
    }
    function formatTitleDate(dateVal) {
        // dateVal is DD-MM-YYYY
        const parts = (dateVal || '').split('-');
        if (parts.length !== 3) return dateVal || '';
        const d = parseInt(parts[0], 10), mo = parseInt(parts[1], 10) - 1, y = parseInt(parts[2], 10);
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        if (mo < 0 || mo > 11 || isNaN(d) || isNaN(y)) return dateVal;
        return String(d).padStart(2, '0') + ' ' + months[mo] + ' ' + y;
    }

    function exportExcel() {
        if (!lastRows || !lastRows.length) return alert('No results to export');
        const wl = (document.getElementById('whitelabel') || {}).value || 'HSB';
        const period = ((document.getElementById('date-input') || {}).value || '').trim() || 'nodate';
        const fileName = REPORT_TYPE + '_' + wl + '-' + period + '.xlsx';
        const titleDate = formatTitleDate(period);
        const titleText = 'Biggest Profit > $1000 for ' + titleDate;

        const headers = ['BusinessType','Login','IDCRM/Name','Group','PL','Lot','Floating','LifetimePLIX','LifetimePLMT','LifetimePL','FTD','Balance'];
        const aoa = [[titleText], headers];

        lastRows.forEach(r => {
            aoa.push([
                r.BusinessType || r.business_type || '',
                toNum(r.Login || r.login),
                r['IDCRM/Name'] || r.idcrm_name || r.Name || '',
                r.Group || r.group || '',
                toNum(r.PL || r.pl),
                toNum(r.Lot || r.lot),
                toNum(r.Floating || r.floating),
                toNum(r.LifetimePLIX || r.lifetime_pl_ix),
                toNum(r.LifetimePLMT || r.lifetime_pl_mt),
                toNum(r.LifetimePL || r.lifetime_pl),
                parseFtdDate(r.FTD || r.ftd),
                toNum(r.Balance || r.balance)
            ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(aoa);

        // Merge title A1:L1
        ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 11 } }];

        // Title style on all merged cells
        for (let C = 0; C <= 11; C++) {
            const addr = XLSX.utils.encode_cell({ r: 0, c: C });
            if (!ws[addr]) ws[addr] = { t: 's', v: '' };
            ws[addr].s = XL_TITLE_STYLE;
        }
        ws['A1'].v = titleText;
        ws['A1'].t = 's';

        // Header row (row 1)
        for (let C = 0; C <= 11; C++) {
            const addr = XLSX.utils.encode_cell({ r: 1, c: C });
            if (ws[addr]) ws[addr].s = XL_HEADER_STYLE;
        }

        // Data rows
        for (let R = 2; R < aoa.length; R++) {
            for (let C = 0; C <= 11; C++) {
                const addr = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[addr]) {
                    ws[addr] = { t: 's', v: '', s: XL_CELL_STYLE };
                    continue;
                }
                if (C === 1) { // Login
                    if (typeof ws[addr].v === 'number') {
                        ws[addr].t = 'n';
                        ws[addr].s = XL_LOGIN_STYLE;
                    } else {
                        ws[addr].s = XL_CELL_STYLE;
                    }
                } else if (C === 4 || C === 6 || C === 7 || C === 8 || C === 9 || C === 11) { // currency cols
                    if (typeof ws[addr].v === 'number') {
                        ws[addr].t = 'n';
                        ws[addr].s = XL_CURR_STYLE;
                    } else {
                        ws[addr].s = XL_CELL_STYLE;
                    }
                } else if (C === 5) { // Lot
                    if (typeof ws[addr].v === 'number') {
                        ws[addr].t = 'n';
                        ws[addr].s = XL_LOT_STYLE;
                    } else {
                        ws[addr].s = XL_CELL_STYLE;
                    }
                } else if (C === 10) { // FTD date
                    if (typeof ws[addr].v === 'number') {
                        ws[addr].t = 'n';
                        ws[addr].s = XL_DATE_STYLE;
                    } else {
                        ws[addr].s = XL_CELL_STYLE;
                    }
                } else {
                    ws[addr].s = XL_CELL_STYLE;
                }
            }
        }

        // Column widths
        ws['!cols'] = [
            { wch: 14 }, // BusinessType
            { wch: 14 }, // Login
            { wch: 16 }, // IDCRM/Name
            { wch: 18 }, // Group
            { wch: 14 }, // PL
            { wch: 10 }, // Lot
            { wch: 14 }, // Floating
            { wch: 14 }, // LifetimePLIX
            { wch: 14 }, // LifetimePLMT
            { wch: 14 }, // LifetimePL
            { wch: 12 }, // FTD
            { wch: 14 }  // Balance
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Daily Biggest Profit');
        XLSX.writeFile(wb, fileName);
    }

    socket.on('report-result', p => { if(p.reportType!==REPORT_TYPE) return; document.getElementById('loading').classList.add('d-none'); render(p.data||{}); });
    socket.on('report-error', p => {
        if(p.reportType && p.reportType!==REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        const box=document.getElementById('error-box');
        box.textContent = p.message || 'Error';
        if(p.rawOutput) box.textContent += '\n'+p.rawOutput.substring(0,800);
        box.classList.remove('d-none');
    });


    function setTheme(t){ document.documentElement.setAttribute('data-theme',t); document.body.setAttribute('data-theme',t); localStorage.setItem('theme',t);
        document.getElementById('theme-toggle').innerHTML = t==='dark'
            ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`
            : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTheme(localStorage.getItem('theme')||'light');
        document.getElementById('theme-toggle').onclick = () => setTheme((document.documentElement.getAttribute('data-theme')||'light')==='dark'?'light':'dark');
        
        const toggler = document.querySelector('.navbar-toggler');
        if (toggler) toggler.addEventListener('click', () => toggler.classList.toggle('rotated'));
// Calendar: weekends not selectable (no special gray styling)
        fp = flatpickr('#date-input', {
            dateFormat: 'd-m-Y',
            allowInput: false,
            disable: [function(date) { return (date.getDay() === 0 || date.getDay() === 6); }]
        });
    });
    </script>
</body>
</html>
