    <script>
    const socket = io();
    const REPORT_TYPE = 'RegulatoryTrade';
    let lastPivot = null; // { months, monthLabels, rowKeys, matrix }

    const MONTH_NAMES = [
        '', 'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];

    // Preferred CategoryLot order
    const LOT_ORDER = ['Total', 'Mini', 'Micro'];
    // Preferred CategoryUser order
    const USER_ORDER = ['New', 'Old'];

    function fmt(n) {
        if (n == null || n === '') return '-';
        const v = Number(n);
        return isNaN(v) ? String(n) : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function numClass(n) { const v = Number(n); if (n == null || n === '' || isNaN(v)) return ''; return v > 0 ? 'positive' : (v < 0 ? 'negative' : ''); }

    function monthKeyToLabel(mmYYYY) {
        // "01-2026" -> "January-2026"
        const parts = String(mmYYYY).split('-');
        if (parts.length !== 2) return mmYYYY;
        const mm = parseInt(parts[0], 10);
        const yyyy = parts[1];
        if (mm >= 1 && mm <= 12) return MONTH_NAMES[mm] + '-' + yyyy;
        return mmYYYY;
    }

    function parseMonthSortKey(mmYYYY) {
        // "01-2026" -> 202601 for sorting
        const parts = String(mmYYYY).split('-');
        if (parts.length !== 2) return 0;
        const mm = parseInt(parts[0], 10);
        const yyyy = parseInt(parts[1], 10);
        return yyyy * 100 + (isNaN(mm) ? 0 : mm);
    }

    function extractRows(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.rows)) return data.rows;
        if (data && Array.isArray(data.Records)) return data.Records;
        if (data && Array.isArray(data.data)) return data.data;
        if (data && typeof data === 'object') {
            for (const k of Object.keys(data)) {
                if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === 'object') {
                    return data[k];
                }
            }
        }
        return [];
    }

    function getField(r, ...names) {
        for (const n of names) {
            if (r[n] != null) return r[n];
            const alt = Object.keys(r).find(k => k.toLowerCase() === n.toLowerCase());
            if (alt && r[alt] != null) return r[alt];
        }
        return null;
    }

    function pivotData(rawRows) {
        // Collect unique months sorted
        const monthSet = new Set();
        const pairSet = new Map(); // key "CategoryLot|CategoryUser" -> { CategoryLot, CategoryUser }

        rawRows.forEach(r => {
            const month = getField(r, 'Month', 'month');
            const lot = getField(r, 'CategoryLot', 'category_lot', 'Category');
            const user = getField(r, 'CategoryUser', 'category_user', 'User');
            if (month) monthSet.add(String(month));
            if (lot != null && user != null) {
                const key = String(lot) + '|' + String(user);
                if (!pairSet.has(key)) pairSet.set(key, { CategoryLot: String(lot), CategoryUser: String(user) });
            }
        });

        const months = Array.from(monthSet).sort((a, b) => parseMonthSortKey(a) - parseMonthSortKey(b));
        const monthLabels = months.map(monthKeyToLabel);

        // Sort row pairs: Total/Mini/Micro then New/Old
        let rowKeys = Array.from(pairSet.values());
        rowKeys.sort((a, b) => {
            const la = LOT_ORDER.indexOf(a.CategoryLot);
            const lb = LOT_ORDER.indexOf(b.CategoryLot);
            const oa = la === -1 ? 99 : la;
            const ob = lb === -1 ? 99 : lb;
            if (oa !== ob) return oa - ob;
            const ua = USER_ORDER.indexOf(a.CategoryUser);
            const ub = USER_ORDER.indexOf(b.CategoryUser);
            return (ua === -1 ? 99 : ua) - (ub === -1 ? 99 : ub);
        });

        // matrix[rowIdx][monthIdx] = { QuantityUser, TotalLot }
        const matrix = rowKeys.map(() => months.map(() => ({ QuantityUser: null, TotalLot: null })));

        rawRows.forEach(r => {
            const month = String(getField(r, 'Month', 'month') || '');
            const lot = String(getField(r, 'CategoryLot', 'category_lot', 'Category') || '');
            const user = String(getField(r, 'CategoryUser', 'category_user', 'User') || '');
            const qty = getField(r, 'QuantityUser', 'quantity_user', 'Quantity');
            const lotVal = getField(r, 'TotalLot', 'total_lot', 'Lot');

            const mi = months.indexOf(month);
            const ri = rowKeys.findIndex(p => p.CategoryLot === lot && p.CategoryUser === user);
            if (mi < 0 || ri < 0) return;

            matrix[ri][mi] = {
                QuantityUser: qty != null && qty !== '' ? Number(qty) : null,
                TotalLot: lotVal != null && lotVal !== '' ? Number(lotVal) : null
            };
        });

        return { months, monthLabels, rowKeys, matrix };
    }

    function runReport() {
        const wl = document.getElementById('whitelabel').value;
        const q = document.getElementById('date-input').value;
        const y = (document.getElementById('year-input').value || '').trim();
        if (!q) return alert('Select a quarter');
        if (!/^\d{4}$/.test(y)) return alert('Year must be yyyy');
        const additionalInfo = `${wl}_${q}-${y}`;
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        socket.emit('run-report', { reportType: REPORT_TYPE, additionalInfo });
    }

    function clearAll() {
        document.getElementById('date-input').value = '';
        document.getElementById('year-input').value = '';
        document.getElementById('whitelabel').value = 'HSB';
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        document.getElementById('reports-content').innerHTML = '';
        lastPivot = null;
    }

    function render(data) {
        const rawRows = extractRows(data);
        if (!rawRows.length) {
            document.getElementById('reports-content').innerHTML =
                `<div class="card mb-4"><div class="card-header bg-info text-white">Regulatory Trade</div>
                <div class="card-body text-center text-muted">No data</div></div>`;
            document.getElementById('result-container').classList.remove('d-none');
            lastPivot = null;
            return;
        }

        const pivot = pivotData(rawRows);
        lastPivot = pivot;
        const { monthLabels, rowKeys, matrix } = pivot;

        // Header row 1: CategoryLot | CategoryUser | each month colspan=2
        let groupTh = `
            <th rowspan="2" class="group-header align-middle">CategoryLot</th>
            <th rowspan="2" class="group-header align-middle">CategoryUser</th>`;
        groupTh += monthLabels.map(lab =>
            `<th colspan="2" class="group-header">${lab}</th>`
        ).join('');

        // Header row 2: QuantityUser | TotalLot per month
        let subTh = monthLabels.map(() =>
            `<th>QuantityUser</th><th>TotalLot</th>`
        ).join('');

        const body = rowKeys.map((rk, ri) => {
            let cells = `<td><strong>${rk.CategoryLot}</strong></td><td>${rk.CategoryUser}</td>`;
            cells += matrix[ri].map(cell => {
                const q = cell.QuantityUser;
                const t = cell.TotalLot;
                return `<td class="text-end ${numClass(q)}">${q == null ? '-' : fmt(q)}</td>` +
                       `<td class="text-end ${numClass(t)}">${t == null ? '-' : fmt(t)}</td>`;
            }).join('');
            return `<tr>${cells}</tr>`;
        }).join('');

        const colCount = 2 + monthLabels.length * 2;
        const html = `
        <div class="card mb-4">
            <div class="card-header bg-info text-white section-header">Regulatory Trade (${rowKeys.length} rows × ${monthLabels.length} months)</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm table-hover mb-0" id="regulatory-trade-table">
                    <thead>
                        <tr>${groupTh}</tr>
                        <tr>${subTh}</tr>
                    </thead>
                    <tbody>
                        ${body || `<tr><td colspan="${colCount}" class="text-center text-muted">No data</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>`;

        document.getElementById('reports-content').innerHTML = html;
        document.getElementById('result-container').classList.remove('d-none');
    }

    function exportExcel() {
        if (!lastPivot || !lastPivot.rowKeys.length) return alert('No data to export');

        const wl = (document.getElementById('whitelabel') || {}).value || 'HSB';
        const q = (document.getElementById('date-input') || {}).value || '';
        const y = ((document.getElementById('year-input') || {}).value || '').trim();
        const period = (q && y) ? (q + '-' + y) : 'nodate';
        const fileName = REPORT_TYPE + '_' + wl + '-' + period + '.xlsx';

        const { monthLabels, rowKeys, matrix } = lastPivot;
        const nMonths = monthLabels.length;

        // Row 0: CategoryLot | CategoryUser | Jan-2026 | '' | Feb-2026 | '' | ...
        const header1 = ['CategoryLot', 'CategoryUser'];
        monthLabels.forEach(lab => {
            header1.push(lab);
            header1.push('');
        });

        // Row 1: '' | '' | QuantityUser | TotalLot | QuantityUser | TotalLot | ...
        const header2 = ['', ''];
        for (let i = 0; i < nMonths; i++) {
            header2.push('QuantityUser');
            header2.push('TotalLot');
        }

        const dataRows = rowKeys.map((rk, ri) => {
            const row = [rk.CategoryLot, rk.CategoryUser];
            matrix[ri].forEach(cell => {
                row.push(cell.QuantityUser);
                row.push(cell.TotalLot);
            });
            return row;
        });

        const aoa = [header1, header2, ...dataRows];
        const ws = XLSX.utils.aoa_to_sheet(aoa);

        // Merges:
        // A1:A2 CategoryLot, B1:B2 CategoryUser
        // Each month: C1:D1, E1:F1, G1:H1, ...
        const merges = [
            { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } },
            { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }
        ];
        for (let i = 0; i < nMonths; i++) {
            const c = 2 + i * 2;
            merges.push({ s: { r: 0, c: c }, e: { r: 0, c: c + 1 } });
        }
        ws['!merges'] = merges;

        // Styles
        const XL_BORDER = {
            top:    { style: 'thin', color: { rgb: '000000' } },
            bottom: { style: 'thin', color: { rgb: '000000' } },
            left:   { style: 'thin', color: { rgb: '000000' } },
            right:  { style: 'thin', color: { rgb: '000000' } }
        };
        // Yellow header (A1:H2 area / entire header rows)
        const XL_HEADER_STYLE = {
            font: { bold: true },
            fill: { fgColor: { rgb: 'FFFF00' } },
            border: XL_BORDER,
            alignment: { horizontal: 'center', vertical: 'center', wrapText: true }
        };
        // Light gray for CategoryLot / CategoryUser data cells (A3:B8 area)
        const XL_CAT_STYLE = {
            font: { bold: true },
            fill: { fgColor: { rgb: 'D9D9D9' } },
            border: XL_BORDER,
            alignment: { horizontal: 'center', vertical: 'center' }
        };
        const XL_CELL_STYLE = {
            border: XL_BORDER,
            alignment: { vertical: 'center' }
        };
        const XL_NUM_STYLE = {
            border: XL_BORDER,
            alignment: { horizontal: 'right', vertical: 'center' },
            numFmt: '#,##0.00'
        };

        const range = XLSX.utils.decode_range(ws['!ref']);
        const colWidths = [];

        for (let R = range.s.r; R <= range.e.r; R++) {
            for (let C = range.s.c; C <= range.e.c; C++) {
                const addr = XLSX.utils.encode_cell({ r: R, c: C });
                let cell = ws[addr];

                // Header rows 0-1 (Excel A1:H2 area): yellow fill + center
                if (R <= 1) {
                    if (!cell) {
                        cell = { t: 's', v: '' };
                        ws[addr] = cell;
                    }
                    cell.s = XL_HEADER_STYLE;
                    const text = String(cell.v != null ? cell.v : '');
                    const len = text.length + 2;
                    if (!colWidths[C] || len > colWidths[C]) colWidths[C] = len;
                    continue;
                }

                // Data rows: light gray on columns A-B (CategoryLot / CategoryUser)
                // User requested A3:B8 specifically; apply to all category data cells
                if (C <= 1) {
                    if (!cell) {
                        cell = { t: 's', v: '' };
                        ws[addr] = cell;
                    }
                    cell.s = XL_CAT_STYLE;
                    const text = String(cell.v != null ? cell.v : '');
                    const len = text.length + 2;
                    if (!colWidths[C] || len > colWidths[C]) colWidths[C] = len;
                    continue;
                }

                // Other data cells: border only if has value
                if (!cell) continue;
                const v = cell.v;
                if (v === null || v === undefined || v === '') continue;

                if (typeof v === 'number') {
                    cell.s = XL_NUM_STYLE;
                } else {
                    cell.s = XL_CELL_STYLE;
                }

                const text = String(v);
                const len = text.length + 2;
                if (!colWidths[C] || len > colWidths[C]) colWidths[C] = len;
            }
        }

        // Autofit columns (min 8, no max)
        ws['!cols'] = [];
        for (let C = range.s.c; C <= range.e.c; C++) {
            const w = colWidths[C];
            ws['!cols'][C] = { wch: w ? Math.max(8, w) : 12 };
        }

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Regulatory Trade');
        XLSX.writeFile(wb, fileName);
    }

    socket.on('report-result', p => {
        if (p.reportType !== REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        render(p.data || {});
    });
    socket.on('report-error', p => {
        if (p.reportType && p.reportType !== REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        const box = document.getElementById('error-box');
        box.textContent = p.message || 'Error';
        if (p.rawOutput) box.textContent += '\n' + p.rawOutput.substring(0, 800);
        box.classList.remove('d-none');
    });

    function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t); document.body.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        document.getElementById('theme-toggle').innerHTML = t === 'dark'
            ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`
            : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTheme(localStorage.getItem('theme') || 'light');
        document.getElementById('theme-toggle').onclick = () =>
            setTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark');
    
        const toggler = document.querySelector('.navbar-toggler');
        if (toggler) toggler.addEventListener('click', () => toggler.classList.toggle('rotated'));
});
    </script>
