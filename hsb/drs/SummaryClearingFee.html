    <style>
      :root {

         --accent: #4a6cf7; --accent-soft: rgba(74, 108, 247, 0.12);

         --shadow-in: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
         --shadow-in-sm: inset 3px 3px 6px #a3b1c6, inset -3px -3px 6px #ffffff;

      }
      [data-theme="dark"] {

         --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, 0.15);
         --success: #34d399; --warning: #fbbf24; --info: #38bdf8; --danger: #f87171;
         --shadow-out: 8px 8px 18px #0d0f14, -8px -8px 18px #2a2f3a;
         --shadow-out-sm: 4px 4px 12px #0d0f14, -4px -4px 12px #2a2f3a;
         --shadow-in: inset 5px 5px 12px #0d0f14, inset -5px -5px 12px #2a2f3a;
         --shadow-in-sm: inset 3px 3px 7px #0d0f14, inset -3px -3px 7px #2a2f3a;
         --card-bg: #1a1d24; --table-header: #252a34; --border-soft: rgba(148, 163, 184, 0.12);
         --navbar-bg: #1a1d24;
      }
      * { box-sizing: border-box; }
      body {
         font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
         background: var(--bg) !important; color: var(--text) !important;

         min-height: 100dvh; transition: background 0.45s ease, color 0.45s ease;

      }
      .navbar {
         position: fixed; top: 14px; left: 50%; transform: translateX(-50%);

      .navbar-nav .nav-link:hover { color: var(--accent) !important; background: var(--accent-soft); box-shadow: var(--shadow-in-sm); }

      .theme-toggle {

      .navbar-toggler { border: none !important; padding: 8px; border-radius: 50%; box-shadow: var(--shadow-out-sm); background: var(--bg); transition: all 0.35s ease; }

      }

    <script>
    (function () {
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const saved = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', saved);
        themeToggle.addEventListener('click', () => {
            const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        document.querySelector('.navbar-toggler')?.addEventListener('click', function () {
            this.classList.toggle('rotated');
        });

        function wireDropZone(dropId, inputId, nameId) {
            const drop = document.getElementById(dropId);
            const input = document.getElementById(inputId);
            const nameEl = document.getElementById(nameId);

            drop.addEventListener('click', () => input.click());
            drop.addEventListener('dragover', (e) => {
                e.preventDefault();
                drop.classList.add('dragover');
            });
            drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
            drop.addEventListener('drop', (e) => {
                e.preventDefault();
                drop.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length) {
                    input.files = files;
                    showFileName(input, nameEl);
                }
            });
            input.addEventListener('change', () => showFileName(input, nameEl));
        }

        function showFileName(input, nameEl) {
            if (input.files && input.files[0]) {
                nameEl.textContent = input.files[0].name;
                nameEl.classList.remove('d-none');
            } else {
                nameEl.textContent = '';
                nameEl.classList.add('d-none');
            }
        }

        wireDropZone('hsb-drop', 'hsb-file', 'hsb-name');
        wireDropZone('lmr-drop', 'lmr-file', 'lmr-name');

        const form = document.getElementById('clearing-fee-form');
        const btnGenerate = document.getElementById('btn-generate');
        const btnClear = document.getElementById('btn-clear');
        const btnDownload = document.getElementById('btn-download');
        const statusInfo = document.getElementById('status-info');
        const statusSuccess = document.getElementById('status-success');
        const statusError = document.getElementById('status-error');
        const resultSection = document.getElementById('result-section');
        const sheetTabs = document.getElementById('sheet-tabs');
        const sheetTable = document.getElementById('sheet-table');
        const resultFileTitle = document.getElementById('result-file-title');

        let lastBlob = null;
        let lastFilename = 'Summary of Clearing Fee.xlsx';
        let workbookData = null; // { sheetName: rows[][] }
        let activeSheet = null;

        function hideStatus() {
            statusInfo.classList.remove('show');
            statusSuccess.classList.remove('show');
            statusError.classList.remove('show');
            statusInfo.innerHTML = '';
            statusSuccess.innerHTML = '';
            statusError.innerHTML = '';
        }
        function showInfo(html) {
            hideStatus();
            statusInfo.innerHTML = html;
            statusInfo.classList.add('show');
        }
        function showSuccess(html) {
            hideStatus();
            statusSuccess.innerHTML = html;
            statusSuccess.classList.add('show');
        }
        function showError(html) {
            hideStatus();
            statusError.innerHTML = html;
            statusError.classList.add('show');
        }

        function clearResult() {
            lastBlob = null;
            workbookData = null;
            activeSheet = null;
            resultSection.classList.remove('show');
            sheetTabs.innerHTML = '';
            sheetTable.querySelector('thead').innerHTML = '';
            sheetTable.querySelector('tbody').innerHTML = '';
            resultFileTitle.textContent = 'Summary result';
        }

        btnClear.addEventListener('click', () => {
            form.reset();
            document.getElementById('hsb-name').classList.add('d-none');
            document.getElementById('lmr-name').classList.add('d-none');
            document.getElementById('hsb-name').textContent = '';
            document.getElementById('lmr-name').textContent = '';
            hideStatus();
            clearResult();
        });

        btnDownload.addEventListener('click', () => {
            if (!lastBlob) return;
            const url = URL.createObjectURL(lastBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = lastFilename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        function excelSerialToDate(n) {
            // Excel serial date → JS Date (approx; SheetJS often already converts)
            if (typeof n !== 'number' || !isFinite(n)) return n;
            const epoch = new Date(Date.UTC(1899, 11, 30));
            const d = new Date(epoch.getTime() + n * 86400000);
            return d;
        }

        function formatCell(val, colIdx, isHeader) {
            if (val == null || val === '') return '';
            if (val instanceof Date) {
                const dd = String(val.getUTCDate()).padStart(2, '0');
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return dd + '-' + months[val.getUTCMonth()];
            }
            if (typeof val === 'number' && isFinite(val)) {
                // Col 0 often date serial if not converted
                if (colIdx === 0 && val > 40000 && val < 60000 && !isHeader) {
                    const d = excelSerialToDate(val);
                    if (d instanceof Date && !isNaN(d.getTime())) {
                        const dd = String(d.getUTCDate()).padStart(2, '0');
                        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                        return dd + '-' + months[d.getUTCMonth()];
                    }
                }
                return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return String(val);
        }

        function isTotalRow(row) {
            if (!row || !row.length) return false;
            const first = row[0];
            return first != null && String(first).trim().toLowerCase() === 'total';
        }

        function renderSheet(name) {
            activeSheet = name;
            const rows = workbookData[name] || [];
            const thead = sheetTable.querySelector('thead');
            const tbody = sheetTable.querySelector('tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            document.querySelectorAll('.sheet-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.sheet === name);
            });

            if (!rows.length) {
                tbody.innerHTML = '<tr><td class="text-muted">No data</td></tr>';
                return;
            }

            // Row 0 = title (merged in Excel), Row 1 = headers, rest = data
            const titleRow = rows[0] || [];
            const headerRow = rows[1] || [];
            const dataRows = rows.slice(2);

            // Title
            if (titleRow.some((c) => c != null && String(c).trim() !== '')) {
                const tr = document.createElement('tr');
                tr.className = 'title-row';
                const td = document.createElement('td');
                td.colSpan = Math.max(headerRow.length, titleRow.length, 1);
                td.textContent = String(titleRow[0] || titleRow.find((c) => c) || '');
                tr.appendChild(td);
                tbody.appendChild(tr);
            }

            // Header
            const hr = document.createElement('tr');
            const greenHeaders = new Set([
                'Total Lot (US Stock)',
                'Total Lot (Floating Rate)',
                'Total All Lots',
                'Total Clearing Fee',
                'HSB'
            ]);
            headerRow.forEach((h, i) => {
                const th = document.createElement('th');
                const text = h == null ? '' : String(h);
                th.textContent = text;
                if (greenHeaders.has(text)) th.classList.add('cell-green');
                // Column P (index 15) orange spacer in source
                if (i === 15) th.classList.add('cell-orange');
                hr.appendChild(th);
            });
            thead.appendChild(hr);

            // Data + total
            dataRows.forEach((row) => {
                const tr = document.createElement('tr');
                const total = isTotalRow(row);
                if (total) tr.className = 'total-row';

                const maxCols = Math.max(headerRow.length, row.length);
                for (let i = 0; i < maxCols; i++) {
                    const td = document.createElement('td');
                    const raw = row[i];
                    const text = formatCell(raw, i, false);
                    td.textContent = text;

                    const isNum = typeof raw === 'number' || /^-?[\d,]+\.?\d*$/.test(String(raw || '').replace(/,/g, ''));
                    if (isNum && i !== 0 && !total) {
                        td.classList.add('num');
                        if (typeof raw === 'number' && raw < 0) td.classList.add('neg');
                    }
                    if (i === 15) td.classList.add('cell-orange');
                    // Green highlight columns matching green headers (by index of known names)
                    const hName = headerRow[i] != null ? String(headerRow[i]) : '';
                    if (greenHeaders.has(hName) && hName !== 'HSB') td.classList.add('cell-green');

                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        function displayWorkbook(blob, filename) {
            lastBlob = blob;
            lastFilename = filename || lastFilename;
            resultFileTitle.textContent = lastFilename;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array', cellDates: true });
                    workbookData = {};
                    sheetTabs.innerHTML = '';

                    wb.SheetNames.forEach((name, idx) => {
                        const sheet = wb.Sheets[name];
                        const rows = XLSX.utils.sheet_to_json(sheet, {
                            header: 1,
                            defval: '',
                            raw: true
                        });
                        workbookData[name] = rows;

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'sheet-tab' + (idx === 0 ? ' active' : '');
                        btn.dataset.sheet = name;
                        btn.textContent = name;
                        btn.addEventListener('click', () => renderSheet(name));
                        sheetTabs.appendChild(btn);
                    });

                    resultSection.classList.add('show');
                    if (wb.SheetNames.length) {
                        renderSheet(wb.SheetNames[0]);
                    }
                    showSuccess(
                        'Summary generated successfully. Preview below — use <strong>Download Excel</strong> to save the file.'
                    );
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (err) {
                    console.error(err);
                    showError('Generated file received but could not be parsed for preview: ' + err.message);
                    // Still allow download
                    resultSection.classList.add('show');
                    sheetTabs.innerHTML = '';
                    sheetTable.querySelector('thead').innerHTML = '';
                    sheetTable.querySelector('tbody').innerHTML =
                        '<tr><td class="text-muted">Preview unavailable — you can still download the Excel file.</td></tr>';
                }
            };
            reader.onerror = () => showError('Failed to read generated workbook for preview.');
            reader.readAsArrayBuffer(blob);
        }

        form.addEventListener('submit', async (e) => {
            // DEMO_INTERCEPT — allow start without real upload
            e.preventDefault();
            const loading = document.getElementById('loading') || document.getElementById('result-area');
            const resultBox = document.getElementById('result-container') || document.getElementById('result-area');
            if (document.getElementById('btn-generate')) document.getElementById('btn-generate').disabled = true;
            try {
                const res = await fetch('/api/drs/summary-clearing-fee', { method: 'POST', body: new FormData() });
                const data = await res.json();
                // Prefer existing result renderer if present
                if (typeof showResult === 'function') showResult(data);
                else if (typeof renderResult === 'function') renderResult(data);
                else {
                    const box = document.getElementById('result-container') || document.getElementById('result-area') || document.getElementById('reports-content');
                    if (box) {
                        box.classList.remove('d-none');
                        const rows = data.rows || [];
                        let html = '<div class="table-responsive"><table class="table table-sm table-bordered"><thead><tr><th>Login</th><th>Symbol</th><th>Volume</th><th>ClearingFee</th><th>Profit</th></tr></thead><tbody>';
                        rows.forEach(r => { html += `<tr><td>${r.Login||'-'}</td><td>${r.Symbol||'-'}</td><td>${r.Volume||'-'}</td><td>${r.ClearingFee||'-'}</td><td>${r.Profit||'-'}</td></tr>`; });
                        html += '</tbody></table></div><p class="text-muted small mt-2">Demo mode — dummy clearing fee rows</p>';
                        box.innerHTML = html;
                    }
                }
            } catch (err) {
                alert('Demo error: ' + err.message);
            } finally {
                if (document.getElementById('btn-generate')) document.getElementById('btn-generate').disabled = false;
            }
            return;
            // original handler below (unreachable in demo)

            e.preventDefault();
            hideStatus();
            clearResult();

            const hsbInput = document.getElementById('hsb-file');
            const lmrInput = document.getElementById('lmr-file');

            if (!hsbInput.files || !hsbInput.files[0]) {
                showError('Please select the <strong>HSB OTC Clearing Fee</strong> Excel file.');
                return;
            }
            if (!lmrInput.files || !lmrInput.files[0]) {
                showError('Please select the <strong>LMR OTC Clearing Fee</strong> Excel file.');
                return;
            }

            const formData = new FormData();
            formData.append('hsb', hsbInput.files[0]);
            formData.append('lmr', lmrInput.files[0]);

            btnGenerate.disabled = true;
            btnGenerate.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Generating…';
            showInfo('Uploading files and running summaryclearingfee.py…');

            try {
                const res = await fetch('/api/drs/summary-clearing-fee', {
                    method: 'POST',
                    body: formData
                });

                const contentType = (res.headers.get('content-type') || '').toLowerCase();

                if (contentType.includes('application/json')) {
                    const payload = await res.json();
                    if (!res.ok) {
                        throw new Error(payload.error || payload.message || ('HTTP ' + res.status));
                    }
                    showSuccess(payload.message || 'Summary generated.');
                    return;
                }

                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(text || ('HTTP ' + res.status));
                }

                // Excel binary (or octet-stream)
                const blob = await res.blob();
                const disposition = res.headers.get('content-disposition') || '';
                let filename = 'Summary of Clearing Fee.xlsx';
                const match = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                if (match && match[1]) {
                    filename = match[1].replace(/['"]/g, '').trim();
                }

                displayWorkbook(blob, filename);
            } catch (err) {
                console.error(err);
                showError('Failed to generate summary: ' + (err.message || String(err)));
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.innerHTML = 'Generate Summary';
            }
        });
    })();
    </script>
