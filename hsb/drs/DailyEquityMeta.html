                        <h5 class="mb-0 section-header">One Click System</h5>
                        <button id="export-excel" class="btn btn-light btn-sm" onclick="exportExcel()">Export Excel</button>
                    </div>
                    <div class="card-body">
                        <div class="row g-3 align-items-end justify-content-center mb-3">
                            <div class="col-auto">
                                <label class="form-label mb-1">Whitelabel</label>
                                <select id="whitelabel" class="form-select form-select-lg">
                                    <option value="HSB">HSB (Direct/IB)</option>
                                    <option value="GLR">GLR (Glory)</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label mb-1">Month</label>
                                <input type="text" id="date-input" class="form-control form-control-lg" placeholder="Select month" readonly>
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary btn-lg px-4" onclick="runReport()">Start</button>
                                <button class="btn btn-outline-secondary btn-lg px-4" onclick="clearAll()">CLEAR</button>
                            </div>
                        </div>
                        <p class="info-yellow small text-center mb-0">AdditionalInfo: <code>Whitelabel_MM-YYYY</code></p>
                        <div id="loading" class="text-center py-5 d-none"><div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem"></div><p>Running Daily Equity Meta...</p></div>
                        <div id="error-box" class="alert alert-danger d-none mt-3" style="white-space:pre-wrap"></div>
                        <div id="result-container" class="d-none mt-4"><div id="reports-content"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>
    <script>
    const socket = io();
    const REPORT_TYPE = 'DailyEquityMeta';
    let fp = null;
    let lastRows = [];

    // Columns: Date | Float x4 | 10K x4 | 12K x4 | 14K x4
    const COL_KEYS = [
        'Date',
        'BalanceFloat', 'FloatingFloat', 'EquityFloat', 'NegativeBalanceFloat',
        'Balance10K', 'Floating10K', 'Equity10K', 'NegativeBalance10K',
        'Balance12K', 'Floating12K', 'Equity12K', 'NegativeBalance12K',
        'Balance14K', 'Floating14K', 'Equity14K', 'NegativeBalance14K'
    ];
    const SUB_HEADERS = [
        'Date',
        'Balance', 'Floating', 'Equity', 'Negative Balance',
        'Balance', 'Floating', 'Equity', 'Negative Balance',
        'Balance', 'Floating', 'Equity', 'Negative Balance',
        'Balance', 'Floating', 'Equity', 'Negative Balance'
    ];
    const GROUP_HEADERS = [
        { label: 'Date', colspan: 1, rowspan: 2 },
        { label: 'META Floating Rate', colspan: 4, rowspan: 1 },
        { label: 'META 10.000', colspan: 4, rowspan: 1 },
        { label: 'META 12.000', colspan: 4, rowspan: 1 },
        { label: 'META 14.000', colspan: 4, rowspan: 1 }
    ];

    function fmt(n) {
        if (n == null || n === '') return '-';
        const v = Number(n);
        return isNaN(v) ? String(n) : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function numClass(n) { const v = Number(n); if (n == null || n === '' || isNaN(v)) return ''; return v > 0 ? 'positive' : (v < 0 ? 'negative' : ''); }

    function runReport() {
        const wl = document.getElementById('whitelabel').value;
        let dateVal = (document.getElementById('date-input') && document.getElementById('date-input').value.trim()) || '15-09-2025';
        const additionalInfo = `${wl}_${dateVal}`;
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        socket.emit('run-report', { reportType: REPORT_TYPE, additionalInfo });
    }

    function clearAll() {
        if (fp) fp.clear();
        document.getElementById('whitelabel').value = 'HSB';
        document.getElementById('result-container').classList.add('d-none');
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-box').classList.add('d-none');
        document.getElementById('reports-content').innerHTML = '';
        lastRows = [];
    }

    function extractRows(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.rows)) return data.rows;
        if (data && Array.isArray(data.Records)) return data.Records;
        if (data && Array.isArray(data.data)) return data.data;
        if (data && typeof data === 'object') {
            for (const k of Object.keys(data)) {
                if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === 'object') {
                    return data[k];
                }
            }
        }
        return [];
    }

    function render(data) {
        const rows = extractRows(data);
        lastRows = rows;

        const groupTh = GROUP_HEADERS.map(g => {
            if (g.rowspan === 2) {
                return `<th rowspan="2" class="group-header align-middle">${g.label}</th>`;
            }
            return `<th colspan="${g.colspan}" class="group-header">${g.label}</th>`;
        }).join('');

        // Sub-headers skip Date (already rowspan=2)
        const subTh = SUB_HEADERS.slice(1).map(h => `<th>${h}</th>`).join('');

        const body = rows.map(r => {
            const cells = COL_KEYS.map((key, idx) => {
                let v = r[key];
                if (v == null) {
                    const alt = Object.keys(r).find(k => k.toLowerCase() === key.toLowerCase());
                    if (alt) v = r[alt];
                }
                if (idx === 0) return `<td>${v != null && v !== '' ? v : '-'}</td>`;
                return `<td class="text-end ${numClass(v)}">${fmt(v)}</td>`;
            }).join('');
            return `<tr>${cells}</tr>`;
        }).join('');

        const html = `
        <div class="card mb-4">
            <div class="card-header bg-info text-white section-header">Daily Equity Meta (${rows.length} rows)</div>
            <div class="card-body table-responsive p-0">
                <table class="table table-bordered table-sm table-hover mb-0" id="equity-meta-table">
                    <thead>
                        <tr>${groupTh}</tr>
                        <tr>${subTh}</tr>
                    </thead>
                    <tbody>
                        ${body || '<tr><td colspan="17" class="text-center text-muted">No data</td></tr>'}
                    </tbody>
                </table>
            </div>
        </div>`;

        document.getElementById('reports-content').innerHTML = html;
        document.getElementById('result-container').classList.remove('d-none');
    }

    function exportExcel() {
        if (!lastRows.length) return alert('No data to export');

        const wl = (document.getElementById('whitelabel') || {}).value || 'HSB';
        const period = ((document.getElementById('date-input') || {}).value || '').trim() || 'nodate';
        const fileName = REPORT_TYPE + '_' + wl + '-' + period + '.xlsx';

        // Row 0 group headers, Row 1 sub headers, then data from row 2
        const header1 = [
            'Date',
            'META Floating Rate', '', '', '',
            'META 10.000', '', '', '',
            'META 12.000', '', '', '',
            'META 14.000', '', '', ''
        ];
        const header2 = [
            '',
            'Balance', 'Floating', 'Equity', 'Negative Balance',
            'Balance', 'Floating', 'Equity', 'Negative Balance',
            'Balance', 'Floating', 'Equity', 'Negative Balance',
            'Balance', 'Floating', 'Equity', 'Negative Balance'
        ];

        const dataRows = lastRows.map(r => COL_KEYS.map(key => {
            let v = r[key];
            if (v == null) {
                const alt = Object.keys(r).find(k => k.toLowerCase() === key.toLowerCase());
                if (alt) v = r[alt];
            }
            if (v == null || v === '') return null;
            if (key !== 'Date') {
                const n = Number(v);
                if (!isNaN(n)) return n;
            }
            return v;
        }));

        const aoa = [header1, header2, ...dataRows];
        const ws = XLSX.utils.aoa_to_sheet(aoa);

        // Merges: Date A1:A2 | META Floating B1:E1 | META 10K F1:I1 | META 12K J1:M1 | META 14K N1:Q1
        ws['!merges'] = [
            { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } },
            { s: { r: 0, c: 1 }, e: { r: 0, c: 4 } },
            { s: { r: 0, c: 5 }, e: { r: 0, c: 8 } },
            { s: { r: 0, c: 9 }, e: { r: 0, c: 12 } },
            { s: { r: 0, c: 13 }, e: { r: 0, c: 16 } }
        ];

        // Styles
        const XL_BORDER = {
            top:    { style: 'thin', color: { rgb: '000000' } },
            bottom: { style: 'thin', color: { rgb: '000000' } },
            left:   { style: 'thin', color: { rgb: '000000' } },
            right:  { style: 'thin', color: { rgb: '000000' } }
        };
        const XL_HEADER_STYLE = {
            font: { bold: true },
            fill: { fgColor: { rgb: 'FFFF00' } }, // yellow
            border: XL_BORDER,
            alignment: { horizontal: 'center', vertical: 'center', wrapText: true }
        };
        const XL_CELL_STYLE = {
            border: XL_BORDER,
            alignment: { vertical: 'center' }
        };
        // Positive / zero numbers
        const XL_NUM_POS = {
            border: XL_BORDER,
            alignment: { horizontal: 'right', vertical: 'center' },
            numFmt: '#,##0.00'
        };
        // Negative numbers: (#,##0.00) in red
        const XL_NUM_NEG = {
            border: XL_BORDER,
            alignment: { horizontal: 'right', vertical: 'center' },
            numFmt: '#,##0.00;(#,##0.00)',
            font: { color: { rgb: 'FF0000' } }
        };

        const range = XLSX.utils.decode_range(ws['!ref']);
        const colWidths = [];

        for (let R = range.s.r; R <= range.e.r; R++) {
            for (let C = range.s.c; C <= range.e.c; C++) {
                const addr = XLSX.utils.encode_cell({ r: R, c: C });
                let cell = ws[addr];

                // Ensure header cells A1:Q2 exist so yellow fill applies even on empty merge fillers
                if (R <= 1) {
                    if (!cell) {
                        cell = { t: 's', v: '' };
                        ws[addr] = cell;
                    }
                    cell.s = XL_HEADER_STYLE;
                    const text = String(cell.v != null ? cell.v : '');
                    const len = text.length + 2;
                    if (!colWidths[C] || len > colWidths[C]) colWidths[C] = len;
                    continue;
                }

                // Data rows: only style cells that have a value
                if (!cell) continue;
                const v = cell.v;
                if (v === null || v === undefined || v === '') continue;

                if (typeof v === 'number') {
                    cell.s = (v < 0) ? XL_NUM_NEG : XL_NUM_POS;
                } else {
                    cell.s = XL_CELL_STYLE;
                }

                const text = String(v);
                const len = text.length + 2;
                if (!colWidths[C] || len > colWidths[C]) colWidths[C] = len;
            }
        }

        // Autofit columns (min 8, no max)
        ws['!cols'] = [];
        for (let C = range.s.c; C <= range.e.c; C++) {
            const w = colWidths[C];
            if (w) {
                ws['!cols'][C] = { wch: Math.max(8, w) };
            } else {
                ws['!cols'][C] = { wch: 12 };
            }
        }

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Daily Equity Meta');
        XLSX.writeFile(wb, fileName);
    }

    socket.on('report-result', p => {
        if (p.reportType !== REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        render(p.data || {});
    });
    socket.on('report-error', p => {
        if (p.reportType && p.reportType !== REPORT_TYPE) return;
        document.getElementById('loading').classList.add('d-none');
        const box = document.getElementById('error-box');
        box.textContent = p.message || 'Error';
        if (p.rawOutput) box.textContent += '\n' + p.rawOutput.substring(0, 800);
        box.classList.remove('d-none');
    });

    function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t); document.body.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        document.getElementById('theme-toggle').innerHTML = t === 'dark'
            ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`
            : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTheme(localStorage.getItem('theme') || 'light');
        document.getElementById('theme-toggle').onclick = () =>
            setTheme((document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark');
        
        const toggler = document.querySelector('.navbar-toggler');
        if (toggler) toggler.addEventListener('click', () => toggler.classList.toggle('rotated'));
fp = flatpickr('#date-input', {
            plugins: [
                new monthSelectPlugin({
                    shorthand: true,
                    dateFormat: 'm-Y',
                    altFormat: 'F Y'
                })
            ],
            allowInput: false
        });
    });
    </script>
</body>
</html>
